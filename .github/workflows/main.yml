name: Generate Snake

on:
  schedule:
    # Her 6 saatte bir çalışır
    - cron: "0 */6 * * *"
  # Manuel tetiklemek için
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # GitHub Token'a repoya yazma yetkisi veriyoruz (Hata vermemesi için en kritik kısım)
    permissions:
      contents: write

    steps:
      # Repoyu check-out yapıyoruz (v4 sürümüne güncellendi)
      - uses: actions/checkout@v4

      # Yılan animasyonunu üreten modern action (v3 sürümüne güncellendi)
      - uses: Platane/snk@v3
        with:
          github_user_name: schizoideveloper
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#bfdbfe,#60a5fa,#3b82f6,#1d4ed8,#1e3a8a

      # Oluşan dosyaları "output" branch'ine güvenli şekilde pushlar
      - name: Push changes
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
